openapi: 3.0.0
info:
  title: Subscription Tracker API
  version: 1.0.0
  description: An API to manage user subscriptions.

servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Customer:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        name:
          type: string
          example: "Jane Doe"
        email:
          type: string
          format: email
          example: "jane.doe@example.com"
        created_date:
          type: string
          format: date-time
          example: "2023-10-27T10:00:00.000Z"

    Subscription:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Netflix"
        category:
          type: string
          example: "Entertainment"
        cost:
          type: number
          format: float
          example: 15.99
        renewal_date:
          type: string
          format: date
          example: "2024-12-01"
        created_date:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        message:
          type: string

paths:
  /customers:
    post:
      summary: Create a new customer
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  customer_id:
                    type: string
                    format: uuid
        '400':
          description: Bad Request - Missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /login:
    post:
      summary: Authenticate a customer
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customer/profile:
    get:
      summary: Get current customer's profile
      tags: [Customer]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          description: Unauthorized
    put:
      summary: Update current customer's profile
      tags: [Customer]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Customer updated
        '401':
          description: Unauthorized
    delete:
      summary: Delete current customer's profile
      tags: [Customer]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer deleted
        '401':
          description: Unauthorized

  /subscriptions:
    get:
      summary: List all subscriptions for the current customer
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthorized
    post:
      summary: Create a new subscription
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, cost, renewal_date]
              properties:
                name:
                  type: string
                category:
                  type: string
                cost:
                  type: number
                renewal_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Subscription created
        '401':
          description: Unauthorized

  /subscriptions/expense:
    get:
      summary: Get subscription expenses
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Calculated daily, monthly, and yearly expenses
          content:
            application/json:
              schema:
                type: object
                properties:
                  day_expense:
                    type: number
                    format: float
                    example: 2.13
                  month_expense:
                    type: number
                    format: float
                    example: 63.90
                  year_expense:
                    type: number
                    format: float
                    example: 777.45
        '401':
          description: Unauthorized

  /subscriptions/{subscription_id}:
    parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Update a subscription
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                cost:
                  type: number
                renewal_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Subscription updated
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    delete:
      summary: Delete a subscription
      tags: [Subscriptions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription deleted
        '401':
          description: Unauthorized
        '404':
          description: Not Found