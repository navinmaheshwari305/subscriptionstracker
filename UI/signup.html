<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Subscription Tracker Sign Up</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white">
<div class="flex flex-col justify-center items-center min-h-screen px-4">
<div class="w-full max-w-sm">
<div class="text-center mb-8">
<h1 class="text-3xl font-bold text-gray-900 dark:text-white">Create Account</h1>
<p class="text-gray-500 dark:text-gray-400 mt-2">Start tracking your subscriptions</p>
</div>
<form class="space-y-4" id="signupForm">
<div id="error-message" class="hidden p-3 bg-red-100 dark:bg-red-900/50 border border-red-400 dark:border-red-600 text-red-700 dark:text-red-300 rounded-lg text-sm"></div>
<div>
<label class="sr-only" for="name">Full Name</label>
<input class="w-full h-12 px-4 bg-white/50 dark:bg-white/10 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-primary focus:border-primary text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400" id="name" name="name" placeholder="Full Name" type="text" required/>
</div>
<div>
<label class="sr-only" for="email">Email</label>
<input class="w-full h-12 px-4 bg-white/50 dark:bg-white/10 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-primary focus:border-primary text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400" id="email" name="email" placeholder="Email" type="email" required/>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<input class="w-full h-12 px-4 bg-white/50 dark:bg-white/10 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-primary focus:border-primary text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400" id="password" name="password" placeholder="Password" type="password" required/>
</div>
<div>
<label class="sr-only" for="confirm-password">Confirm Password</label>
<input class="w-full h-12 px-4 bg-white/50 dark:bg-white/10 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-primary focus:border-primary text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400" id="confirm-password" name="confirm-password" placeholder="Confirm Password" type="password" required/>
</div>
<div class="pt-2">
<button class="w-full h-12 px-6 bg-primary text-white font-bold rounded-lg hover:bg-primary/90 transition-colors duration-200" type="submit">
                        Sign Up
                    </button>
</div>
</form>
<div class="mt-6 text-center">
<a class="text-sm text-primary hover:underline" href="login.html">
                    Already have an account? Log in
                </a>
</div>
</div>
</div>

<script>
    const form = document.getElementById('signupForm');
    const errorMessageDiv = document.getElementById('error-message');
    const API_BASE_URL = "http://localhost:3000";

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMessageDiv.classList.add('hidden');
        errorMessageDiv.textContent = '';

        const name = form.name.value;
        const email = form.email.value;
        const password = form.password.value;
        const confirmPassword = form['confirm-password'].value;

        if (password !== confirmPassword) {
            errorMessageDiv.textContent = 'Passwords do not match.';
            errorMessageDiv.classList.remove('hidden');
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/customers`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Failed to create account.');
            }

            // Redirect to login page after successful signup
            window.location.href = 'login.html';

        } catch (error) {
            errorMessageDiv.textContent = error.message;
            errorMessageDiv.classList.remove('hidden');
        }
    });
</script>

</body></html>
