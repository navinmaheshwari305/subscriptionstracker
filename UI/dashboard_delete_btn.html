<!-- Toast container (top right, auto-disappear, with close button) -->
<div id="toast" class="fixed top-6 right-6 z-50 min-w-[200px] max-w-xs px-4 py-3 rounded-lg shadow-lg text-white text-center text-sm font-medium opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-between gap-2"></div>

<script>
  // --- Authentication Check ---
  // This should be the very first script to run.
  const authToken = localStorage.getItem('authToken');
  if (!authToken) {
    // If no token, redirect to login page.
    window.location.href = 'login.html';
  }
</script>

<script>
  // Toast utility (auto-disappear, top right, with close button)
  let toastTimeout;
  function showToast(message, type = "success") {
  const toast = document.getElementById('toast');
  toast.innerHTML = `
    <span class="flex-1 text-left">${message}</span>
    <button id="toastCloseBtn" class="ml-2 text-white/80 hover:text-white focus:outline-none">
      <span class="material-symbols-outlined" style="font-size:1.2em;">close</span>
    </button>
  `;
  toast.className =
    "fixed top-6 right-6 z-50 min-w-[200px] max-w-xs px-4 py-3 rounded-lg shadow-lg text-white text-center text-sm font-medium opacity-100 pointer-events-auto transition-all duration-300 flex items-center justify-between gap-2 " +
    (type === "success" ? "bg-green-600" : "bg-red-600");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove("opacity-100", "pointer-events-auto");
    toast.classList.add("opacity-0");
    // Optionally clear after transition
    setTimeout(() => {
      toast.innerHTML = "";
      toast.className =
        "fixed top-6 right-6 z-50 min-w-[200px] max-w-xs px-4 py-3 rounded-lg shadow-lg text-white text-center text-sm font-medium opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-between gap-2";
    }, 300);
  }, 3000);
  document.getElementById('toastCloseBtn').onclick = function() {
    clearTimeout(toastTimeout);
    toast.classList.remove("opacity-100", "pointer-events-auto");
    toast.classList.add("opacity-0");
    setTimeout(() => {
      toast.innerHTML = "";
      toast.className =
        "fixed top-6 right-6 z-50 min-w-[200px] max-w-xs px-4 py-3 rounded-lg shadow-lg text-white text-center text-sm font-medium opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-between gap-2";
    }, 300);
  };
  }

  // --- Backend Integration ---
  const API_BASE_URL = "http://localhost:3000";
  // Use the token from localStorage.
  const AUTH_TOKEN = localStorage.getItem('authToken');

  let subscriptions = []; // This will be populated from the backend.

  // Fetches all subscriptions from the backend
  async function fetchSubscriptions() {
    try {
      const response = await fetch(`${API_BASE_URL}/subscriptions`, {
        headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
      });
      if (!response.ok) {
        if (response.status === 401) {
          // Token is invalid or expired, clear it and redirect to login
          localStorage.removeItem('authToken');
          window.location.href = 'login.html';
        }
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      const data = await response.json();
      // Map backend data to frontend format
      subscriptions = data.subscriptions.map(mapSubscriptionToFrontend);
      renderSubscriptions();
    } catch (error) {
      console.error("Failed to fetch subscriptions:", error);
      showToast("Could not load subscriptions.", "error");
    }
  }

  // Fetches totals from the backend API
  async function fetchTotalsFromBackend() {
    try {
      const response = await fetch(`${API_BASE_URL}/subscriptions/expense`, {
        headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
      });
      if (!response.ok) {
        if (response.status === 401) {
          localStorage.removeItem('authToken');
          window.location.href = 'login.html';
        }
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      const data = await response.json();
      return {
        daily: data.day_expense || 0,
        monthly: data.month_expense || 0,
        yearly: data.year_expense || 0
      };
    } catch (error) {
      console.error("Failed to fetch totals:", error);
      showToast("Could not load expense totals.", "error");
      return { daily: 0, monthly: 0, yearly: 0 }; // Return zeroed values on error
    }
  }

  // Category list for selector
  const CATEGORIES = [
    { name: "Music", value: "music_note" },
    { name: "Video", value: "movie" },
    { name: "News", value: "newspaper" },
    { name: "Cloud", value: "cloud" },
    { name: "Productivity", value: "description" },
    { name: "Gaming", value: "sports_esports" },
    { name: "Fitness", value: "fitness_center" },
    { name: "Coffee", value: "local_cafe" },
    { name: "Feed", value: "feed" },
    { name: "Domain", value: "language" },
    { name: "Other", value: "subscriptions" }
  ];

  // Helper to map backend subscription to frontend format
  function mapSubscriptionToFrontend(sub) {
    const renewalDate = new Date(sub.renewal_date);
    const today = new Date();
    today.setHours(0, 0, 0, 0); // Normalize today's date

    // The backend schema doesn't include frequency, so we'll default it.
    // This might need adjustment based on your actual business logic.
    const frequency = sub.frequency || "Monthly"; 

    return {
      id: sub.subscription_id,
      name: sub.name,
      cost: parseFloat(sub.cost).toFixed(2),
      renewal: sub.renewal_date,
      category: sub.category, // Assuming backend category matches frontend icon names
      type: renewalDate < today ? "due" : "upcoming",
      frequency: frequency,
    };
  }

  // Render subscriptions with frequency & renewal as labels
  function renderSubscriptions() {
    const list = document.getElementById('subscriptionsList');
    list.innerHTML = '';
    subscriptions.forEach((sub) => {
      const renewalClass = sub.type === "due" ? "bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-300" : "bg-gray-100 text-gray-700 dark:bg-gray-800 dark:text-gray-300";
      const freqClass = "bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300";
      list.innerHTML += `
        <div class="subscription-row flex items-center gap-4 p-3 rounded-lg bg-white/5 dark:bg-black/10 transition-all duration-200 group">
          <div class="flex items-center justify-center w-10 h-10 rounded-lg bg-primary/10">
            <span class="material-symbols-outlined text-primary">${sub.category}</span>
          </div>
          <div class="flex-grow">
            <p class="font-semibold text-gray-900 dark:text-white">${sub.name}</p>
            <div class="flex gap-2 mt-1">
              <span class="px-2 py-0.5 rounded text-xs font-medium ${freqClass} capitalize">${sub.frequency}</span>
              <span class="px-2 py-0.5 rounded text-xs font-medium ${renewalClass}">Renewal: ${sub.renewal}</span>
            </div>
          </div>
          <p class="font-semibold text-gray-900 dark:text-white">₹${sub.cost}</p>
          <button class="ml-2 p-2 text-red-500 dark:text-red-400 hover:bg-red-500/10 rounded-full" onclick="showDeleteModal('${sub.id}')">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
      `;
    });
    updateTotals();
  }

  // Update totals (fetch from backend)
  async function updateTotals() {
    const { daily, monthly, yearly } = await fetchTotalsFromBackend();
    document.getElementById('dailyTotal').textContent = `₹${daily.toFixed(2)}`;
    document.getElementById('monthlyTotal').textContent = `₹${monthly.toFixed(2)}`;
    document.getElementById('yearlyTotal').textContent = `₹${yearly.toFixed(2)}`;
  }

  // Populate category selector in add modal
  function populateCategorySelector() {
    const catSelect = document.getElementById('category');
    catSelect.innerHTML = CATEGORIES.map(cat =>
      `<option value="${cat.value}">${cat.name}</option>`
    ).join('');
  }

  // Add Subscription Modal logic
  const addBtn = document.getElementById('addBtn');
  const addModal = document.getElementById('addModal');
  addBtn.addEventListener('click', function(e) {
    e.preventDefault();
    addModal.classList.remove('hidden');
    populateCategorySelector();
  });
  function closeAddModal() {
    addModal.classList.add('hidden');
    document.getElementById('addSubscriptionForm').reset();
    document.getElementById('addStatus')?.remove();
  }

  // Add Subscription form submit
  document.getElementById('addSubscriptionForm').onsubmit = async function(e) {
    e.preventDefault();
    const form = e.target;
    const newSubData = {
      name: form.name.value,
      cost: parseFloat(form.cost.value),
      renewal_date: form.renewal.value,
      category: form.category.value,
      frequency: form.frequency.value,
    };

    let status = document.getElementById('addStatus');
    if (!status) {
      status = document.createElement('div');
      status.id = 'addStatus';
      status.className = 'mt-2 text-sm';
      form.appendChild(status);
    }    
    status.textContent = "Adding...";    
    try {
      const response = await fetch(`${API_BASE_URL}/subscriptions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${AUTH_TOKEN}`
        },
        body: JSON.stringify(newSubData)
      });
      if (!response.ok) {
        throw new Error('Failed to add subscription');
      }
      status.textContent = "Subscription added!";
      showToast("Subscription added!", "success");
      fetchSubscriptions(); // Re-fetch the list from the server
      setTimeout(closeAddModal, 1000);
    } catch (error) {
      status.textContent = "Error: " + error.message;
      showToast("Failed to add subscription.", "error");
    }
  };

  // Delete Modal logic
  const deleteModal = document.getElementById('deleteModal');
  let deleteIdx = null;
  function showDeleteModal(idx) {
    deleteIdx = idx;
    const subToDelete = subscriptions.find(s => s.id === idx);
    deleteModal.querySelector('p.mt-2').textContent =
      `Are you sure you want to delete the '${subToDelete.name}' subscription? This action cannot be undone.`;
    deleteModal.classList.remove('hidden');
    if (!deleteModal.querySelector('#deleteStatus')) {
      const status = document.createElement('div');
      status.id = 'deleteStatus';
      status.className = 'mt-2 text-sm';
      deleteModal.querySelector('.flex.justify-center.gap-4').after(status);
    } else {
      deleteModal.querySelector('#deleteStatus').textContent = '';
    }
  }
  function closeDeleteModal() {
    deleteModal.classList.add('hidden');
    if (deleteModal.querySelector('#deleteStatus')) {
      deleteModal.querySelector('#deleteStatus').textContent = '';
    }
  }
  // Confirm delete
  deleteModal.querySelector('.bg-red-600').onclick = async function() {
    const status = deleteModal.querySelector('#deleteStatus');
    status.textContent = "Deleting...";
    try {
      const response = await fetch(`${API_BASE_URL}/subscriptions/${deleteIdx}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
      });
      if (!response.ok) {
        throw new Error('Failed to delete subscription');
      }
      status.textContent = "Subscription deleted!";
      showToast("Subscription deleted!", "success");
      fetchSubscriptions(); // Re-fetch the list from the server
      setTimeout(closeDeleteModal, 800);
    } catch (error) {
      status.textContent = "Error: " + error.message;
      showToast("Failed to delete subscription.", "error");
    }
  };

  // Initial render
  fetchSubscriptions();

  // --- Logout Logic ---
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('authToken');
      // Redirect to login page after logout
      window.location.href = 'login.html';
    });
  }
</script>

<!-- Add category selector to the add subscription form at the top -->

</script>

<!-- Add rupee sign to cost input in add modal -->
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const costInput = document.getElementById('cost');
    if (costInput && !document.getElementById('rupee-prefix')) {
      const wrapper = document.createElement('div');
      wrapper.className = "relative";
      costInput.parentNode.insertBefore(wrapper, costInput);
      wrapper.appendChild(costInput);
      const rupee = document.createElement('span');
      rupee.id = "rupee-prefix";
      rupee.textContent = "₹";
      rupee.className = "absolute left-3 top-1/2 -translate-y-1/2 text-gray-400";
      costInput.classList.add("pl-7");
      wrapper.appendChild(rupee);
    }
  });
</script>
